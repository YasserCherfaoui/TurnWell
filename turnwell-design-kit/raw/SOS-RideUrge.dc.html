<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOS — ride the urge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#EEF0FA}a:hover{color:#C4B5FD}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, sans-serif; color: #EEF0FA; background: linear-gradient(170deg, #050816 0%, #0B1230 45%, #1A1446 80%, #2A1A5E 100%)">
  <div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; border-radius: 50%; background: #7C3AED; filter: blur(100px); opacity: 0.45; top: 140px; left: 25px"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <sc-for list="{{ stars }}" as="s" hint-placeholder-count="30">
      <span style="{{ s.style }}"></span>
    </sc-for>
  </div>
  <svg width="390" height="240" viewBox="0 0 390 240" aria-hidden="true" style="position: absolute; left: 0; bottom: 0">
    <defs>
      <linearGradient id="ru-w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.55"></stop><stop offset="1" stop-color="#1E1B4B" stop-opacity="0.2"></stop></linearGradient>
      <linearGradient id="ru-w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"></stop><stop offset="1" stop-color="#2E1065" stop-opacity="0.3"></stop></linearGradient>
      <linearGradient id="ru-w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.35"></stop><stop offset="1" stop-color="#0B1230" stop-opacity="0.6"></stop></linearGradient>
    </defs>
    <path d="M0 90 C 60 60, 120 110, 195 80 S 330 60, 390 90 V240 H0 Z" fill="url(#ru-w1)"></path>
    <path d="M0 130 C 70 100, 140 150, 210 120 S 340 105, 390 130 V240 H0 Z" fill="url(#ru-w2)"></path>
    <path d="M0 175 C 80 150, 150 190, 230 165 S 350 150, 390 170 V240 H0 Z" fill="url(#ru-w3)"></path>
  </svg>

  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 52px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
      <a href="SOS-Tools.dc.html" aria-label="Back to tools" style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF0FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <span style="font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(192,38,211,0.18); border: 1px solid rgba(240,171,252,0.35); color: #F5D0FE">Urge 8 / 10 at start</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: Sora, Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.6px">Ride the urge</h1>
      <p style="margin: 0; font-size: 15px; color: rgba(238,240,250,0.8)">Notice it. Don't fight it. Don't act on it.</p>
    </div>

    <div role="timer" aria-label="{{ timerLabel }}" style="{{ ringStyle }}">
      <div style="width: 216px; height: 216px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1A1650, #0B0F2E); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.08)">
        <span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #DDD6FE 22%, #A78BFA 50%, #4C1D95 90%); box-shadow: 0 0 30px rgba(167,139,250,0.9)"></span>
        <span style="font-family: Sora, Inter, sans-serif; font-size: 40px; font-weight: 600; letter-spacing: -1px; font-variant-numeric: tabular-nums">{{ clock }}</span>
        <span style="font-size: 12.5px; color: rgba(238,240,250,0.7)">of 10:00 · breathe with the orb</span>
      </div>
    </div>

    <div style="align-self: stretch; text-align: left; padding: 12px 14px; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.13); backdrop-filter: blur(30px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); display: flex; gap: 12px; align-items: center">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #DDD6FE 22%, #A78BFA 50%, #4C1D95 90%); box-shadow: 0 0 16px rgba(167,139,250,0.7)"></span>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.5">Breathe in for 4… out for 6. Feel your feet on the floor. The wave is already past its peak.</p>
    </div>

    <div style="align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="font-family: Inter, sans-serif; height: 50px; border-radius: 999px; border: 1px solid rgba(94,234,212,0.4); background: rgba(45,212,191,0.14); color: #EEF0FA; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"></path><path d="M3 12h16a3 3 0 1 1-3 3"></path><path d="M3 16h6"></path></svg>Breathe</button>
      <button style="font-family: Inter, sans-serif; height: 50px; border-radius: 999px; border: 1px solid rgba(253,230,138,0.4); background: rgba(251,191,36,0.14); color: #EEF0FA; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="1.5" fill="#FCD34D"></circle></svg>Dhikr</button>
    </div>
    <a href="SOS-Outcome.dc.html" style="align-self: stretch; margin-top: auto; height: 56px; border-radius: 999px; background: linear-gradient(135deg, #EDE9FE, #A78BFA 55%, #7C3AED); color: #1E0B4A; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 30px rgba(139,92,246,0.6), inset 0 1px 0 rgba(255,255,255,0.7)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E0B4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>The urge passed</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 372 };
  }
  componentDidMount() {
    var self = this;
    this.tick = setInterval(function () {
      self.setState(function (s) { return { left: s.left > 0 ? s.left - 1 : 0 }; });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.tick);
  }
  renderVals() {
    var left = this.state.left;
    var m = Math.floor(left / 60);
    var sec = left % 60;
    var pct = Math.round(((600 - left) / 600) * 1000) / 10;
    var stars = [];
    var seed = 77;
    for (var i = 0; i < 30; i++) {
      seed = (seed * 9301 + 49297) % 233280;
      var x = Math.round((seed / 233280) * 386);
      seed = (seed * 9301 + 49297) % 233280;
      var y = Math.round((seed / 233280) * 600);
      seed = (seed * 9301 + 49297) % 233280;
      var r = 1 + Math.round((seed / 233280) * 15) / 10;
      var o = 0.2 + Math.round((seed / 233280) * 50) / 100;
      stars.push({ style: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + r + 'px; height: ' + r + 'px; border-radius: 50%; background: #FFFFFF; opacity: ' + o });
    }
    return {
      stars: stars,
      clock: (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec,
      timerLabel: m + ' minutes ' + sec + ' seconds left',
      ringStyle: 'width: 244px; height: 244px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(#2DD4BF 0%, #818CF8 ' + (pct / 2) + '%, #C084FC ' + pct + '%, rgba(255,255,255,0.10) ' + pct + '% 100%); box-shadow: 0 0 60px rgba(139,92,246,0.35)'
    };
  }
}
</script>
</body>
</html>
