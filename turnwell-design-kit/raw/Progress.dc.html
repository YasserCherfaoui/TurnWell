        <text x="179" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#FFFFFF">23 of 30 days clean</text>
      </svg>
      <div style="align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px">
        <div style="padding: 10px; border-radius: 16px; background: rgba(40,20,90,0.30); display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
          <span style="width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, #FDBA74, #F43F5E); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"></path></svg></span>
          <span style="font-family: Sora, Inter, sans-serif; font-size: 18px; font-weight: 700">12 days</span><span style="font-size: 11.5px; opacity: 0.9">Best run</span></div>
        <div style="padding: 10px; border-radius: 16px; background: rgba(40,20,90,0.30); display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
          <span style="width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, #FFE0A8, #F59A6A); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M2 12h2"></path><path d="M20 12h2"></path></svg></span>

        <div style="padding: 10px; border-radius: 16px; background: rgba(40,20,90,0.30); display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
          <span style="width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, #818CF8, #7C3AED); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 12c2.5 0 2.5-4 5-4s2.5 8 5 8 2.5-8 5-8 2.5 4 5 4"></path></svg></span>

    <div style="padding: 14px; border-radius: 24px; background: linear-gradient(160deg, rgba(60,40,120,0.45), rgba(60,40,120,0.26)); border: 1px solid rgba(255,255,255,0.4); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: Sora, Inter, sans-serif; font-size: 14px; font-weight: 600">Oct 22 – Nov 20</span>
        <div style="display: flex; gap: 10px; font-size: 11px">
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, #FFE0A8, #F59A6A)"></span>Clean</span>
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, #FFE0A8 50%, #9CA3AF 50%)"></span>Partly</span>
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 3px; background: #9CA3AF"></span>Slip</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="30">
          <span aria-label="{{ d.label }}" style="{{ d.style }}"></span>

    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 22px; background: linear-gradient(160deg, rgba(60,40,120,0.50), rgba(60,40,120,0.30)); border: 1px solid rgba(255,255,255,0.4)">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pattern = 'CCSCCCCPCCCCSCCCCCCCCPCSCCCCCC';
    var base = 'height: 26px; border-radius: 8px; ';
    var days = [];
    for (var j = 0; j < pattern.length; j++) {
      var c = pattern.charAt(j);
      var st = c === 'C' ? 'background: linear-gradient(135deg, #FFE0A8, #F59A6A); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6)'
        : c === 'P' ? 'background: linear-gradient(135deg, #FFE0A8 50%, #9CA3AF 50%)'
        : 'background: #9CA3AF';
      if (j === pattern.length - 1) { st += '; outline: 2px solid #FFFFFF; outline-offset: 1px'; }
      var word = c === 'C' ? 'clean' : c === 'P' ? 'partly clean' : 'slip';
      days.push({ label: 'Day ' + (j + 1) + ', ' + word, style: base + st });
    }
    return { days: days };
  }
}
</script>
